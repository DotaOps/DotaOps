sonar.projectKey=dotaops
sonar.projectName=DotaOps
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main,frontend/src,frontend/public,supabase,scripts,.github/workflows
sonar.tests=backend/src/test
sonar.test.inclusions=backend/src/test/**/*.java

sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.typescript.tsconfigPaths=frontend/tsconfig.json
sonar.javascript.node.maxspace=4096

sonar.exclusions=**/node_modules/**,**/.next/**,**/target/**,**/dist/**,**/build/**,**/.vercel/**,**/.scannerwork/**,**/.sonar/**,DotaOps-prediction/**,dota2_hero_icons/**
