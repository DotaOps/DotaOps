name: dotaops

services:
  # Backend (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dotaops-backend
    environment:
      SERVER_PORT: 8080
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000,http://127.0.0.1:3000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      DOTAOPS_IMAGES_BUCKET: ${DOTAOPS_IMAGES_BUCKET:-dotaops-images}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      SUPABASE_JWKS_URI: ${SUPABASE_JWKS_URI:-}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-3}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-0}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-30000}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_POOL_MAX_LIFETIME_MS: ${DB_POOL_MAX_LIFETIME_MS:-600000}
      STEAM_OPENID_ENDPOINT: ${STEAM_OPENID_ENDPOINT:-https://steamcommunity.com/openid/login}
      STEAM_OPENID_REALM: ${STEAM_OPENID_REALM:-http://localhost:8080}
      STEAM_OPENID_RETURN_URL: ${STEAM_OPENID_RETURN_URL:-http://localhost:8080/api/auth/steam/callback}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_PLAYER_SUMMARIES_URL: ${STEAM_PLAYER_SUMMARIES_URL:-https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/}
      FRONTEND_AUTH_REDIRECT_URL: ${FRONTEND_AUTH_REDIRECT_URL:-}
      STEAM_OPENID_STATE_TTL: ${STEAM_OPENID_STATE_TTL:-10m}
      STEAM_SESSION_JWT_SECRET: ${STEAM_SESSION_JWT_SECRET:-}
      STEAM_SESSION_JWT_ISSUER: ${STEAM_SESSION_JWT_ISSUER:-dotaops-backend}
      STEAM_SESSION_JWT_AUDIENCE: ${STEAM_SESSION_JWT_AUDIENCE:-dotaops-steam-session}
      STEAM_SESSION_TTL: ${STEAM_SESSION_TTL:-7d}
      STEAM_SESSION_COOKIE_NAME: ${STEAM_SESSION_COOKIE_NAME:-dotaops_steam_session}
      STEAM_SESSION_COOKIE_PATH: ${STEAM_SESSION_COOKIE_PATH:-/}
      STEAM_SESSION_COOKIE_DOMAIN: ${STEAM_SESSION_COOKIE_DOMAIN:-}
      STEAM_SESSION_COOKIE_SECURE: ${STEAM_SESSION_COOKIE_SECURE:-false}
      STEAM_SESSION_COOKIE_SAME_SITE: ${STEAM_SESSION_COOKIE_SAME_SITE:-Lax}
      OPENDOTA_API_BASE_URL: ${OPENDOTA_API_BASE_URL:-https://api.opendota.com/api}
      OPENDOTA_API_KEY: ${OPENDOTA_API_KEY:-}
      STEAM_CONNECT_TIMEOUT: ${STEAM_CONNECT_TIMEOUT:-2s}
      STEAM_READ_TIMEOUT: ${STEAM_READ_TIMEOUT:-5s}
      OPENDOTA_CONNECT_TIMEOUT: ${OPENDOTA_CONNECT_TIMEOUT:-2s}
      OPENDOTA_READ_TIMEOUT: ${OPENDOTA_READ_TIMEOUT:-5s}
      OPENDOTA_RETRY_MAX_ATTEMPTS: ${OPENDOTA_RETRY_MAX_ATTEMPTS:-3}
      OPENDOTA_RETRY_BACKOFF: ${OPENDOTA_RETRY_BACKOFF:-250ms}
    ports:
      - "8080:8080"
    networks:
      - dotaops-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_SERVER_API_URL: ${NEXT_SERVER_API_URL:-http://backend:8080/api}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: dotaops-frontend
    environment:
      NEXT_SERVER_API_URL: ${NEXT_SERVER_API_URL:-http://backend:8080/api}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dotaops-network

networks:
  dotaops-network:
    driver: bridge
